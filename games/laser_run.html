<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tristan Laser Run</title>
<style>
body{margin:0;background:#dff3ff;font-family:Arial,sans-serif;text-align:center;color:#20252b}
h1{margin:12px 0 5px}.info{font-weight:800;margin-bottom:8px}
#game{position:relative;width:min(720px,94vw);height:min(560px,62vh);min-height:390px;margin:auto;overflow:hidden;border:5px solid #222;border-radius:18px;background:#9bd17c}
#gameControls{position:absolute;top:8px;right:8px;z-index:10000;display:flex!important;gap:8px;pointer-events:auto}#pauseBtn,#resetBtn{display:inline-block!important;visibility:visible!important;opacity:1!important;position:static!important;font-size:14px;font-weight:bold;padding:9px 11px;border:3px solid #222;border-radius:10px;color:#fff;pointer-events:auto}#pauseBtn{background:#6c5ce7}#resetBtn{background:#4285f4}#road{position:absolute;left:10%;right:10%;top:0;bottom:0;background:#d7d7d7}
.line{position:absolute;top:0;bottom:0;width:5px;background:#aaa}.l1{left:30%}.l2{left:50%}.l3{left:70%}
.laser{position:absolute;height:16px;background:#e22;border:3px solid #900;border-radius:10px;box-shadow:0 0 14px #f33}
.item{position:absolute;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:31px;border:3px solid #222;background:white;z-index:5}
.player{position:absolute;bottom:55px;width:50px;height:65px;transform:translateX(-50%);transition:left .15s;z-index:6}.player2{display:none;bottom:55px}.player2 .body{background:#f28c28}
.head{width:28px;height:28px;margin:auto;background:#ffd0a0;border:3px solid #222;border-radius:50%}
.body{width:26px;height:30px;margin:auto;background:#4285f4;border:3px solid #222;border-radius:7px}
.leg{position:absolute;bottom:0;width:9px;height:20px;background:#222;border-radius:5px}.leg1{left:8px}.leg2{right:8px}
#message{position:absolute;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;z-index:20;overflow-y:auto;padding:10px 0;box-sizing:border-box}
.card{background:#fff;padding:14px;border-radius:20px;width:min(300px,82vw);max-height:none;overflow:visible;box-sizing:border-box;margin:auto}.playerPick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.playerPick button{width:100%}.modeScreen{display:none}.modeBtns{display:grid;gap:5px}.modeScreen h2{margin:4px 0 6px}.modeScreen p{font-size:13px;line-height:1.25;margin:5px 0 8px}.modeScreen button{font-size:16px;padding:9px 8px}.modeScreen small{font-size:11px}.modeScreen .chooseRow input{font-size:16px;padding:8px 3px}.modeBtns button{width:100%}.chooseRow{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;justify-content:center}.chooseRow input{width:70px;font-size:20px;font-weight:bold;text-align:center;padding:10px;border:3px solid #222;border-radius:10px}.chooseRow button{flex:1;background:#7b2cbf}
button{font-size:20px;font-weight:bold;padding:12px 20px;border:0;border-radius:12px;background:#4285f4;color:#fff;cursor:pointer}
.controls{margin:12px auto;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;width:min(720px,94vw);box-sizing:border-box}.touchPlayer{min-width:0}
.touchPlayer{background:#fff;border:3px solid #222;border-radius:14px;padding:8px}.touchPlayer strong{display:block;margin-bottom:6px}.touchButtons{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.touchButtons button{margin:0;flex:1;min-height:58px;font-size:24px;touch-action:manipulation;-webkit-user-select:none;user-select:none}.p2btn{background:#f28c28}
@media (max-height:600px){#message{padding:5px 0}.card{padding:9px}.modeScreen p{font-size:11px;line-height:1.15}.modeScreen button{font-size:14px;padding:7px 5px}#backPlayers{margin-top:6px!important}.modeBtns{gap:3px}}

#message .card{width:min(340px,88vw)!important;padding:12px!important;max-height:calc(100% - 16px)!important;overflow-y:auto!important;margin:8px auto!important}
.modeBtns{display:flex!important;flex-direction:column!important;gap:7px!important}
.modeBtns>button{display:block!important;width:100%!important;box-sizing:border-box!important;position:static!important;margin:0!important}
.heartPicker{display:grid!important;grid-template-columns:52px 1fr 52px!important;gap:7px!important;width:100%!important;box-sizing:border-box!important}
.heartPicker button,.heartPicker input{width:100%!important;min-width:0!important;box-sizing:border-box!important;margin:0!important;padding:9px 4px!important}
.chooseBtn{display:block!important;width:100%!important;box-sizing:border-box!important;margin:0!important;background:#7b2cbf!important}
#backPlayers{display:block!important;width:100%!important;box-sizing:border-box!important;margin:8px 0 0!important;position:static!important}
@media (max-height:600px){
 #message .card{padding:7px!important;margin:4px auto!important}
 .modeBtns{gap:4px!important}
 .modeBtns>button,.chooseBtn,#backPlayers{padding:6px!important;font-size:13px!important}
 .heartPicker button,.heartPicker input{padding:6px 3px!important;font-size:13px!important}
 .modeScreen p{font-size:10px!important;line-height:1.1!important;margin:2px 0 5px!important}
 .modeScreen h2{font-size:18px!important;margin:2px!important}
}
#message{z-index:100!important;padding-top:62px!important}#message .card{position:relative!important;width:min(360px,90vw)!important;max-height:94%!important;overflow-y:auto!important;padding:12px!important}#modeScreen,#playerScreen{position:static!important}#modeScreen .modeBtns{display:flex!important;flex-direction:column!important;gap:8px!important}#modeScreen .modeBtns>*{position:static!important;float:none!important;transform:none!important;flex:none!important}#modeScreen button{min-height:42px!important}#modeScreen .heartPicker{display:grid!important;grid-template-columns:52px minmax(70px,1fr) 52px!important;width:100%!important;gap:8px!important}#modeScreen #backPlayers{margin:0!important}</style>
</head>
<body>
<h1>Tristan Laser Run</h1>
<div class="info">❤️ <span id="lives">3</span> &nbsp; ⭐ Score: <span id="score">0</span> &nbsp; <span id="effect">Normal</span></div>
<div id="game" tabindex="0">
<div id="gameControls"><button id="pauseBtn">⏸ PAUSE</button><button id="resetBtn">🔄 RESET</button></div>
<div id="road"></div><div class="line l1"></div><div class="line l2"></div><div class="line l3"></div>
<div id="lasers"></div><div id="items"></div>
<div class="player" id="player"><div class="head"></div><div class="body"></div><div class="leg leg1"></div><div class="leg leg2"></div></div><div class="player player2" id="player2"><div class="head"></div><div class="body"></div><div class="leg leg1"></div><div class="leg leg2"></div></div>
<div id="message"><div class="card">
<div id="playerScreen">
<h2>👥 PLAYERS</h2>
<p>How many players?</p>
<div class="playerPick"><button id="onePlayer">👤 1 PLAYER</button><button id="twoPlayers" style="background:#f28c28">👥 2 PLAYERS</button></div>
</div>
<div id="modeScreen" class="modeScreen">
<h2>🎮 CHOOSE MODE</h2>
<div class="modeBtns">
<button id="easy" style="background:#2e9d50">😊 EASY • 5 ❤️</button>
<button id="start">🎮 NORMAL • 3 ❤️</button>
<button id="hard" style="background:#b00020">🔥 HARD • 1 ❤️</button>
<div class="heartPicker"><button id="heartMinus" type="button">−</button><input id="heartChoice" type="number" min="1" max="10" value="10" inputmode="numeric" aria-label="Choose hearts"><button id="heartPlus" type="button">+</button></div>
<button id="choose" class="chooseBtn">❤️ CHOOSE</button>
<button id="backPlayers">← PLAYERS</button>
</div></div></div>
</div>
<div class="controls" id="touchControls" style="display:none">
  <div class="touchPlayer"><strong>👤 Player 1</strong><div class="touchButtons"><button id="p1left">◀</button><button id="p1right">▶</button></div></div>
  <div class="touchPlayer"><strong>👤 Player 2</strong><div class="touchButtons"><button class="p2btn" id="p2left">◀</button><button class="p2btn" id="p2right">▶</button></div></div>
</div>
<p>iPad: use the big buttons below • Keyboard: Player 1 = A / D • Player 2 = ← → • Shift = Pause</p>
<script>
(function(){
const game=document.getElementById("game"),player=document.getElementById("player"),player2=document.getElementById("player2"),l3=document.querySelector(".l3"),lasers=document.getElementById("lasers"),itemsBox=document.getElementById("items"),scoreEl=document.getElementById("score"),livesEl=document.getElementById("lives"),effectEl=document.getElementById("effect"),message=document.getElementById("message"),start=document.getElementById("start"),easy=document.getElementById("easy"),hard=document.getElementById("hard"),choose=document.getElementById("choose"),heartChoice=document.getElementById("heartChoice"),p1left=document.getElementById("p1left"),p1right=document.getElementById("p1right"),p2left=document.getElementById("p2left"),p2right=document.getElementById("p2right"),resetBtn=document.getElementById("resetBtn"),pauseBtn=document.getElementById("pauseBtn"),playerScreen=document.getElementById("playerScreen"),modeScreen=document.getElementById("modeScreen"),onePlayer=document.getElementById("onePlayer"),twoPlayers=document.getElementById("twoPlayers"),backPlayers=document.getElementById("backPlayers"),touchControls=document.getElementById("touchControls"),heartMinus=document.getElementById("heartMinus"),heartPlus=document.getElementById("heartPlus");
let lane=0,lane2=1,lives=3,running=false,paused=false,last=0,spawn=0,itemSpawn=0,dual=true,time=0,score=0,items=[],laserRows=[],raf=0,effect="normal",effectTime=0,startLives=3,playerCount=2;const X4=[20,40,60,80];let X=X4;
function setLane(){player.style.left=X[lane]+"%";player2.style.left=X[lane2]+"%"}
function activateSecondLane(){dual=playerCount===2;X=X4;l3.style.display="block";document.querySelector(".l1").style.left="30%";document.querySelector(".l2").style.left="50%";l3.style.left="70%";player2.style.display=dual?"block":"none";setLane()}
function reset(){cancelAnimationFrame(raf);if(typeof pauseBtn!=="undefined")pauseBtn.textContent="⏸ PAUSE";lasers.innerHTML="";itemsBox.innerHTML="";laserRows=[];items=[];lane=0;lane2=1;lives=startLives;dual=true;X=X4;paused=false;last=0;spawn=0;itemSpawn=0;time=0;score=0;effect="normal";effectTime=0;livesEl.textContent=String(startLives);scoreEl.textContent="0";effectEl.textContent="Normal";setLane()}
function makeLaser(){const count=playerCount===1?1+Math.floor(Math.random()*3):(Math.random()<.55?1:2),lanes=[0,1,2,3].sort(()=>Math.random()-.5).slice(0,count),group=document.createElement("div");group.style.position="absolute";group.style.left="10%";group.style.right="10%";group.style.top="-25px";group.style.height="30px";lanes.forEach(l=>{const beam=document.createElement("div");beam.className="laser";beam.style.left=l*25+"%";beam.style.width="25%";group.appendChild(beam)});lasers.appendChild(group);laserRows.push({el:group,lanes,y:-25})}
function makeItem(){const el=document.createElement("div"),l=Math.floor(Math.random()*4);el.className="item";el.textContent="🐌";el.style.left=X[l]-4+"%";el.style.top="-70px";itemsBox.appendChild(el);items.push({el,lane:l,y:-70,type:"slow"})}
function end(){running=false;paused=false;cancelAnimationFrame(raf);message.style.display="flex";playerScreen.style.display="none";modeScreen.style.display="block";message.querySelector("#modeScreen h2").textContent="💥 GAME OVER!";message.querySelector("p").innerHTML=(startLives===1?"🔥 Hard mode: one hit ended the run!":"You used all "+startLives+" lives!")+"<br><b>Score: "+score+"</b>";start.textContent="🎮 NORMAL • 3 ❤️"}
function clampHearts(v){return Math.max(1,Math.min(10,parseInt(v,10)||1))}function begin(mode,customLives){game.focus();touchControls.style.display="grid";startLives=mode==="easy"?5:mode==="hard"?1:mode==="choose"?clampHearts(customLives):3;heartChoice.value=String(startLives);reset();message.style.display="none";running=true;raf=requestAnimationFrame(tick)}
function togglePause(){if(!running)return;paused=!paused;last=performance.now();pauseBtn.textContent=paused?"▶ RESUME":"⏸ PAUSE";effectEl.textContent=paused?"⏸ PAUSED":effect==="slow"?"🐌 SLOW":"Normal";if(!paused)raf=requestAnimationFrame(tick)}
function move(d,which){if(!running||paused)return;if(which===2){const next=Math.max(0,Math.min(3,lane2+d));if(playerCount===2&&next===lane)return;lane2=next}else{const next=Math.max(0,Math.min(3,lane+d));if(playerCount===2&&next===lane2)return;lane=next}setLane()}
function tick(t){if(!running||paused)return;if(!last)last=t;const dt=Math.min(.04,(t-last)/1000);last=t;time+=dt;spawn+=dt;itemSpawn+=dt;score=Math.floor(time*20);scoreEl.textContent=score;activateSecondLane();const progress=Math.max(0,Math.min((score-500)/500,1)),gap=2-.95*progress;if(spawn>gap){spawn=0;makeLaser()}if(itemSpawn>4){itemSpawn=0;makeItem()}const mult=effect==="slow"?.55:3;for(const o of laserRows){o.y+=150*dt*mult;o.el.style.top=o.y+"px";const hitP1=o.lanes.includes(lane)&&o.y>game.clientHeight-145&&o.y<game.clientHeight-70,hitP2=playerCount===2&&o.lanes.includes(lane2)&&o.y>game.clientHeight-145&&o.y<game.clientHeight-70;if(hitP1||hitP2){lives--;livesEl.textContent=lives;o.y=9999;o.el.remove();if(lives<=0){end();return}}}laserRows=laserRows.filter(o=>o.el.isConnected);for(const o of items){o.y+=125*dt*mult;o.el.style.top=o.y+"px";const gotP1=o.lane===lane&&o.y>game.clientHeight-145&&o.y<game.clientHeight-65,gotP2=playerCount===2&&o.lane===lane2&&o.y>game.clientHeight-145&&o.y<game.clientHeight-65;if(gotP1||gotP2){effect=o.type;effectTime=3;o.el.remove()}}items=items.filter(o=>o.el.isConnected);if(effectTime>0){effectTime-=dt;effectEl.textContent="🐌 SLOW "+Math.ceil(effectTime)+"s";if(effectTime<=0)effect="normal"}else if(!paused)effectEl.textContent="Normal";raf=requestAnimationFrame(tick)}
function choosePlayers(n){playerCount=n;playerScreen.style.display="none";modeScreen.style.display="block";activateSecondLane()}onePlayer.addEventListener("click",()=>choosePlayers(1));twoPlayers.addEventListener("click",()=>choosePlayers(2));backPlayers.addEventListener("click",()=>{modeScreen.style.display="none";playerScreen.style.display="block"});start.addEventListener("click",()=>begin("normal"));easy.addEventListener("click",()=>begin("easy"));hard.addEventListener("click",()=>begin("hard"));choose.addEventListener("click",()=>{heartChoice.value=String(clampHearts(heartChoice.value));begin("choose",heartChoice.value)});heartChoice.addEventListener("change",()=>heartChoice.value=String(clampHearts(heartChoice.value)));heartChoice.addEventListener("blur",()=>heartChoice.value=String(clampHearts(heartChoice.value)));heartMinus.addEventListener("click",()=>heartChoice.value=String(Math.max(1,clampHearts(heartChoice.value)-1)));heartPlus.addEventListener("click",()=>heartChoice.value=String(Math.min(10,clampHearts(heartChoice.value)+1)));pauseBtn.addEventListener("click",togglePause);resetBtn.addEventListener("click",()=>{reset();touchControls.style.display="none";message.style.display="flex";message.querySelector("h2").textContent="🎮 READY!";message.querySelector("p").innerHTML="Press <b>START</b> to play.";start.textContent="NORMAL • 3 ❤️";hard.style.display=""});function bindMove(btn,d,which){btn.addEventListener("pointerdown",e=>{e.preventDefault();move(d,which)})}bindMove(p1left,-1,1);bindMove(p1right,1,1);bindMove(p2left,-1,2);bindMove(p2right,1,2);document.addEventListener("keydown",e=>{if(e.key==="Shift"){e.preventDefault();togglePause();return}if(e.key.toLowerCase()==="a"){e.preventDefault();move(-1,1)}if(e.key.toLowerCase()==="d"){e.preventDefault();move(1,1)}if(e.key==="ArrowLeft"){e.preventDefault();if(playerCount===1){move(-1,1)}else{move(-1,2)}}if(e.key==="ArrowRight"){e.preventDefault();if(playerCount===1){move(1,1)}else{move(1,2)}}if(e.key===" "&&!running){e.preventDefault();begin("normal")}});game.addEventListener("pointerdown",()=>game.focus());activateSecondLane();
})();
</script>
</body>
</html>
